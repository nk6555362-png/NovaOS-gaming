dontChroot: false
timeout: 120
script:
    - "-userdel -r nova-live"
    - "-rm -f /etc/sudoers.d/90-nova-live-calamares"
    - "-rm -f /etc/sddm.conf.d/10-novaos-live.conf"
    - "-rm -f /etc/systemd/system/default.target /etc/systemd/system/display-manager.service /etc/systemd/system/getty@tty1.service"
    - "-rm -f /etc/systemd/system/novaos-live-user.service /etc/systemd/system/multi-user.target.wants/novaos-live-user.service"
    - "-rm -f /usr/local/lib/novaos/setup-live-user /usr/share/applications/novaos-installer.desktop"
    - "-systemctl disable pacman-init.service systemd-networkd.service systemd-resolved.service sshd.service"
    - "systemctl enable NetworkManager.service bluetooth.service sddm.service"
    - "systemctl set-default graphical.target"
