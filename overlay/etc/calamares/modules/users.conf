defaultGroups:
    - wheel
    - audio
    - video
    - storage
    - optical

doAutologin: false
sudoersGroup: wheel
sudoersConfigureWithGroup: true
setRootPassword: true
doReusePassword: false
allowWeakPasswords: false

user:
  shell: /bin/bash
  forbidden_names: [ root ]

hostname:
  location: EtcFile
  writeHostsFile: true
