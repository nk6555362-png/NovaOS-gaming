modules-search: [ local ]

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - initcpio
  - grubcfg
  - bootloader
  - shellprocess@live-cleanup
  - users
  - umount
- show:
  - finished

instances:
- id: live-cleanup
  module: shellprocess
  config: live-cleanup.conf

branding: novaos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
